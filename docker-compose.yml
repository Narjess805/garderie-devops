services:
  backend:
    build: ./backend
    container_name: garderie-backend
    environment:
      - PORT=5000
    networks: [garderie-network]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:5000
    container_name: garderie-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
    ports:
      - "3000:3000"
    depends_on: [backend]
    networks: [garderie-network]
networks:
  garderie-network:
    driver: bridge
