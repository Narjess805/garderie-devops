services:
  backend:
    image: ${DOCKERHUB_USER}/garderie-backend:latest
    container_name: garderie-backend
    environment:
      - PORT=5000
    networks: [garderie-network]
    restart: unless-stopped
  frontend:
    image: ${DOCKERHUB_USER}/garderie-frontend:latest
    container_name: garderie-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
    ports:
      - "3000:3000"
    depends_on: [backend]
    networks: [garderie-network]
    restart: unless-stopped
networks:
  garderie-network:
    driver: bridge
